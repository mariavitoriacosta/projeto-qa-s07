services:
  jenkins:
    build:
      context: .
      dockerfile: infra/jenkins/Dockerfile

    image: projeto-qa-s07-jenkins:local

    restart: unless-stopped

    ports:
      - "127.0.0.1:${JENKINS_PORT:-8080}:8080"

    env_file:
      - ./infra/jenkins/.env

    environment:
      JENKINS_ADMIN_USER: ${JENKINS_ADMIN_USER:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?Preencha infra/jenkins/.env}
      JENKINS_URL: ${JENKINS_URL:-http://localhost:8080/}
      CYPRESS_BASE_URL: ${CYPRESS_BASE_URL:-http://frontend}

    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

    shm_size: 1gb

    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://localhost:8080/login
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 20

volumes:
  jenkins_home: