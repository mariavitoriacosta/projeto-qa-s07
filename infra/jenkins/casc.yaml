jenkins:
  systemMessage: "Projeto S07 NP2 - Jenkins configurado por codigo."
  numExecutors: 1
  mode: NORMAL
  slaveAgentPort: -1

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USER}"
          password: "${JENKINS_ADMIN_PASSWORD}"

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: "${JENKINS_URL}"